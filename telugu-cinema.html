<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Telugu Cinema</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="An interactive 3D poster universe of Telugu cinema.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Telugu:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #b8860b;
  --ink: #f2ede2;
  --dim: rgba(242, 237, 226, 0.55);
  --line: rgba(255, 255, 255, 0.12);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: #000; overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  color: var(--ink);
}
#canvas-container { position: fixed; inset: 0; }
body.has-fine-pointer, body.has-fine-pointer * { cursor: none !important; }

/* ---- custom cursor ---- */
#cursor-dot, #cursor-ring {
  position: fixed; top: 0; left: 0; pointer-events: none; z-index: 90;
  border-radius: 50%; transform: translate(-50%, -50%);
  transition: width .15s ease, height .15s ease, border-color .15s ease, opacity .15s ease;
}
#cursor-dot { width: 5px; height: 5px; background: var(--ink); opacity: .9; }
#cursor-ring {
  width: 22px; height: 22px; border: 1px solid rgba(242,237,226,0.5);
  display: flex; align-items: center; justify-content: center;
}
#cursor-ring.hover { width: 46px; height: 46px; border-color: var(--accent); }
#cursor-ring .view-label {
  font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: .08em;
  color: var(--accent); opacity: 0; transition: opacity .15s ease;
}
#cursor-ring.hover .view-label { opacity: 1; }
body.touch-device #cursor-dot, body.touch-device #cursor-ring { display: none; }

/* ---- minimal chrome ---- */
.chrome { position: fixed; z-index: 20; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
#brand { top: 22px; left: 24px; }
#brand .en { color: var(--ink); }
#brand .te { color: var(--dim); font-family: 'Noto Sans Telugu', sans-serif; text-transform: none; letter-spacing: 0; margin-left: 8px; font-size: 12px; }
#settings-toggle { top: 22px; right: 24px; background: none; border: none; color: var(--ink); cursor: pointer; font: inherit; letter-spacing: inherit; text-transform: inherit; padding: 4px; }
#settings-toggle:hover { color: var(--accent); }

#zone-label { bottom: 26px; left: 24px; max-width: 60vw; }
#zone-label .name { color: var(--ink); transition: opacity .35s ease; }
#zone-label .te { display: block; color: var(--dim); font-family: 'Noto Sans Telugu', sans-serif; text-transform: none; letter-spacing: 0; font-size: 12px; margin-top: 4px; }

#explore-hint { bottom: 26px; right: 24px; color: var(--dim); transition: opacity .6s ease; }
#explore-hint.hidden { opacity: 0; pointer-events: none; }

/* ---- settings panel ---- */
#settings-panel {
  position: fixed; top: 56px; right: 24px; z-index: 25; width: 220px;
  background: rgba(10,10,10,0.92); border: 1px solid var(--line); padding: 16px;
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; display: none;
}
#settings-panel.open { display: block; }
#settings-panel h4 { margin: 0 0 10px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-weight: 400; }
#settings-panel .row { display: flex; gap: 6px; margin-bottom: 14px; }
#settings-panel button.opt {
  flex: 1; background: none; border: 1px solid var(--line); color: var(--dim);
  padding: 6px 4px; font: inherit; cursor: pointer; letter-spacing: .05em;
}
#settings-panel button.opt.active { color: var(--ink); border-color: var(--accent); }
#settings-panel label.toggle { display: flex; align-items: center; gap: 8px; color: var(--dim); cursor: pointer; }

/* ---- floating focus caption (near hovered poster) ---- */
#focus-info {
  position: fixed; z-index: 15; pointer-events: none; transform: translate(-50%, -130%);
  text-align: center; opacity: 0; transition: opacity .25s ease;
  font-family: 'Fraunces', serif;
}
#focus-info.visible { opacity: 1; }
#focus-info .t { font-size: 15px; letter-spacing: .01em; }
#focus-info .m { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }

/* ---- loader ---- */
#loader {
  position: fixed; inset: 0; z-index: 100; background: #000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity .7s ease;
}
#loader.fade-out { opacity: 0; pointer-events: none; }
#loader .title { font-family: 'Fraunces', serif; font-size: clamp(28px, 5vw, 48px); letter-spacing: .02em; }
#loader .status { margin-top: 18px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); min-height: 16px; }
#loader .bar { width: 220px; height: 1px; background: var(--line); margin-top: 20px; position: relative; overflow: hidden; }
#loader .bar-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: var(--accent); transition: width .2s ease; }

/* ---- detail overlay ---- */
#scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; transition: opacity .5s ease; }
#scrim.open { opacity: 1; pointer-events: auto; }

#detail {
  position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end;
  padding: 6vh 8vw; pointer-events: none; opacity: 0; transition: opacity .5s ease .1s;
}
#detail.open { opacity: 1; pointer-events: auto; }
#detail .panel { max-width: 520px; }
#detail .back { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; background: none; border: none; color: var(--dim); cursor: pointer; padding: 10px 12px; margin: -10px -12px 8px -12px; }
#detail .back:hover { color: var(--accent); }
#detail h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: clamp(26px, 4vw, 44px); margin: 0 0 6px; line-height: 1.05; }
#detail .meta { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .06em; color: var(--accent); text-transform: uppercase; margin-bottom: 16px; }
#detail .desc { font-size: 15px; line-height: 1.6; color: rgba(242,237,226,0.85); max-width: 46ch; margin-bottom: 22px; }
#detail .related { display: flex; gap: 10px; flex-wrap: wrap; }
#detail .related span { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--dim); border: 1px solid var(--line); padding: 5px 10px; }

@media (max-width: 720px) {
  .chrome { font-size: 9.5px; }
  #detail { padding: 5vh 6vw; }
  #settings-panel { width: 180px; }
}

@media (prefers-reduced-motion: reduce) {
  #loader, #scrim, #detail, #focus-info, #zone-label .name { transition-duration: .05s; }
}

</style>

/* Spatial layout — turns RANKINGS + FILMS into 3D nodes on a sphere.
   Pure math, no Three.js dependency, so it can be unit-tested in Node.
   See README.md "How the sphere is built" for the reasoning. */
window.TC = window.TC || {};

(function () {
  const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

  // Kept for external/legacy use (a whole-sphere spiral); buildLayout
  // below no longer uses this directly — see the per-wedge generator,
  // which guarantees exact counts per ranking instead of filtering a
  // global spiral by azimuth (that approach could statistically drop or
  // duplicate a point or two right at a wedge boundary — fixed here so
  // every real film is guaranteed a place).
  function fibonacciSpherePoints(n, radius) {
    const points = [];
    for (let i = 0; i < n; i++) {
      const yNorm = n === 1 ? 0 : 1 - (i / (n - 1)) * 2; // 1..-1
      const r = Math.sqrt(Math.max(0, 1 - yNorm * yNorm));
      const theta = GOLDEN_ANGLE * i;
      const x = Math.cos(theta) * r;
      const z = Math.sin(theta) * r;
      const azimuth = (Math.atan2(z, x) + Math.PI * 2) % (Math.PI * 2);
      points.push({ x: x * radius, y: yNorm * radius, z: z * radius, azimuth, yNorm });
    }
    return points;
  }

  // Points generated directly within one wedge's azimuth range, still
  // using the golden angle (mod the wedge's own span) for an organic,
  // non-grid spread — but this way every wedge gets exactly the count it
  // asked for, by construction, so no film is ever silently dropped and
  // no wedge ever gets a stray extra "filler" node it wasn't assigned.
  function pointsInWedge(count, start, span, radius) {
    const pts = [];
    for (let j = 0; j < count; j++) {
      const yNorm = count === 1 ? 0 : 1 - (j / (count - 1)) * 2;
      const r = Math.sqrt(Math.max(0, 1 - yNorm * yNorm));
      const frac = ((j * GOLDEN_ANGLE) % (Math.PI * 2)) / (Math.PI * 2); // 0..1
      const azimuth = start + frac * span;
      const x = Math.cos(azimuth) * r, z = Math.sin(azimuth) * r;
      pts.push({ x: x * radius, y: yNorm * radius, z: z * radius, azimuth, yNorm });
    }
    return pts;
  }

  // Build the full node list: each ranking gets a contiguous azimuthal
  // wedge sized by how many nodes (real + filler) it holds, so "which
  // wedge is the camera looking at" and "which wedge holds this ranking"
  // are the same coordinate system — see js/scene.js activeZoneForAngle.
  function buildLayout(opts) {
    const { rankings, films, radius, fillerTotal, restBoostFactor } = opts;

    const byRank = {};
    rankings.forEach(r => (byRank[r.id] = { ranking: r, films: [] }));
    films.forEach(f => byRank[f.rankId].films.push(f));

    const weights = rankings.map(r => {
      const base = Math.max(1, byRank[r.id].films.length);
      return r.key === "rest" ? base * restBoostFactor : base;
    });
    const weightSum = weights.reduce((a, b) => a + b, 0);

    const fillerCounts = rankings.map((r, i) => Math.round((fillerTotal * weights[i]) / weightSum));
    const nodeCounts = rankings.map((r, i) => byRank[r.id].films.length + fillerCounts[i]);
    const totalNodes = nodeCounts.reduce((a, b) => a + b, 0);

    // wedge boundaries proportional to each ranking's node count
    const wedges = [];
    let cursor = 0;
    nodeCounts.forEach((count, i) => {
      const start = (cursor / totalNodes) * Math.PI * 2;
      cursor += count;
      const end = (cursor / totalNodes) * Math.PI * 2;
      wedges.push({ rankId: rankings[i].id, start, end, count });
    });

    const nodes = [];
    wedges.forEach(wedge => {
      const span = wedge.end - wedge.start;
      const filmsForRank = byRank[wedge.rankId].films.slice();
      const pts = pointsInWedge(wedge.count, wedge.start, span, radius);

      // prefer points near the wedge's horizontal middle + the equator for
      // real films, so labeled titles are more likely to be near the
      // default view
      const midAzimuth = wedge.start + span / 2;
      const sorted = pts.slice().sort((a, b) => {
        const da = Math.abs(a.azimuth - midAzimuth) + Math.abs(a.yNorm) * 0.6;
        const db = Math.abs(b.azimuth - midAzimuth) + Math.abs(b.yNorm) * 0.6;
        return da - db;
      });
      sorted.forEach((p, i) => {
        const film = i < filmsForRank.length ? filmsForRank[i] : null;
        nodes.push({
          position: p, rankId: wedge.rankId,
          kind: film ? "film" : "filler",
          film
        });
      });
    });

    return { nodes, wedges };
  }

  window.TC.fibonacciSpherePoints = fibonacciSpherePoints;
  window.TC.buildLayout = buildLayout;
})();

        const fillerGenre = genreKeys.length ? genreKeys[idx % genreKeys.length] : null;
        const texture = isFilm
          ? window.TC.filmTexture(node.film, ranking.accent)
          : window.TC.fillerTexture(ranking.accent, fillerGenre);
        const mat = new THREE.MeshBasicMaterial({
          map: texture, transparent: false, side: THREE.FrontSide,
          opacity: isFilm ? 1 : 0.82
        });
        const mesh = new THREE.Mesh(SHARED_GEOMETRY, mat);
        const jitter = 0.82 + Math.random() * 0.36;
        mesh.scale.set(baseW * jitter, baseH * jitter, 1);
        mesh.position.set(node.position.x, node.position.y, node.position.z);
        mesh.lookAt(0, 0, 0);
        mesh.userData.node = node;
        mesh.userData.baseScale = mesh.scale.clone();
        mesh.userData.normal = mesh.position.clone().normalize();
        mesh.userData.homePosition = mesh.position.clone();
        scene.add(mesh);
        posterMeshes.push(mesh);
      });
    }

    function activeWedgeForAngle(theta) {
      const t = ((theta % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      for (let i = 0; i < wedges.length; i++) if (t >= wedges[i].start && t < wedges[i].end) return wedges[i];
      return wedges[wedges.length - 1];
    }

    // ---- pointer handling (unified mouse + touch via Pointer Events) ----
    function onPointerMove(e) {
      hasPointer = true;
      const rect = container.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      ndc.x = (x / rect.width) * 2 - 1;
      ndc.y = -(y / rect.height) * 2 + 1;
      if (opts.onPointerScreen) opts.onPointerScreen(x, y);

      if (activePointers.has(e.pointerId)) activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (isDown && activePointers.size === 1) {
        const dx = e.clientX - lastX, dy = e.clientY - lastY;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) isDragActuallyMoved = true;
        baseTheta -= dx * DRAG_ROTATE_SPEED;
        basePhi -= dy * DRAG_ROTATE_SPEED;
        basePhi = Math.max(PHI_MIN, Math.min(PHI_MAX, basePhi));
        dragVelTheta = -dx * DRAG_ROTATE_SPEED;
        dragVelPhi = -dy * DRAG_ROTATE_SPEED;
        lastX = e.clientX; lastY = e.clientY;
      } else if (activePointers.size === 2) {
        const pts = Array.from(activePointers.values());
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (pinchStartDist == null) { pinchStartDist = dist; pinchStartRadius = camRadius; }
        else {
          const ratio = pinchStartDist / Math.max(1, dist);
          camRadius = Math.max(FOCUS_RADIUS + 2, Math.min(CAMERA_RADIUS * 1.6, pinchStartRadius * ratio));
        }
      }
    }
    function onPointerDown(e) {
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      downStartedInCanvas = true;
      if (activePointers.size === 1) { isDown = true; isDragActuallyMoved = false; lastX = e.clientX; lastY = e.clientY; dragVelTheta = 0; dragVelPhi = 0; }
      if (activePointers.size >= 2) pinchStartDist = null;
    }
    function onPointerUp(e) {
      activePointers.delete(e.pointerId);
      if (activePointers.size === 0) { isDown = false; pinchStartDist = null; }
      if (downStartedInCanvas && !isDragActuallyMoved && selected == null) {
        // treat as a tap/click -> select whatever is focused under the pointer
        if (focused) selectNode(focused.mesh);
        else if (opts.onEmptyClick) opts.onEmptyClick();
      }
      isDragActuallyMoved = false;
      downStartedInCanvas = false;
    }

    container.style.touchAction = "none";
    window.addEventListener("pointermove", onPointerMove);
    container.addEventListener("pointerdown", onPointerDown);
    window.addEventListener("pointerup", onPointerUp);
    window.addEventListener("pointercancel", onPointerUp);
    window.addEventListener("keydown", e => { if (e.key === "Escape" && selected) goBack(); });

    // ---- focus / select ----
    function setFocused(mesh) {
      if (focused && focused.mesh === mesh) return;
      if (focused) tweenScale(focused.mesh, focused.mesh.userData.baseScale, 220);
      if (mesh) {
        const target = mesh.userData.baseScale.clone().multiplyScalar(1.32);
        tweenScale(mesh, target, 220);
        focused = { mesh, node: mesh.userData.node };
        if (opts.onFocusChange) opts.onFocusChange(mesh.userData.node, projectToScreen(mesh.position));
      } else {
        focused = null;
        if (opts.onFocusChange) opts.onFocusChange(null, null);
      }
    }

    function selectNode(mesh) {
      if (!mesh || mesh.userData.node.kind !== "film") return;
      // clear hover/focus state without a competing scale tween — the
      // select tween below takes the mesh's scale from here
      focused = null;
      if (opts.onFocusChange) opts.onFocusChange(null, null);

      selected = {
        mesh, node: mesh.userData.node,
        returnTheta: baseTheta, returnPhi: basePhi, returnRadius: camRadius
      };
      const normal = mesh.userData.normal;
      const outward = mesh.userData.homePosition.clone().add(normal.clone().multiplyScalar(0.9));
      tweenVec3(mesh.position, outward, 700);
      tweenScale(mesh, mesh.userData.baseScale.clone().multiplyScalar(2.1), 700);

      const targetTheta = Math.atan2(normal.z, normal.x);
      const rawPhi = Math.acos(Math.max(-1, Math.min(1, normal.y)));
      const targetPhi = Math.max(PHI_MIN, Math.min(PHI_MAX, rawPhi));
      tweenAngles(targetTheta, targetPhi, FOCUS_RADIUS, 900);

      if (opts.onSelect) opts.onSelect(mesh.userData.node, computeRelated(mesh.userData.node));
    }

    function goBack() {
      if (!selected) return;
      const mesh = selected.mesh;
      tweenVec3(mesh.position, mesh.userData.homePosition, 600);
      tweenScale(mesh, mesh.userData.baseScale, 600);
      tweenAngles(selected.returnTheta, selected.returnPhi, selected.returnRadius, 700);
      selected = null;
      if (opts.onDeselect) opts.onDeselect();
    }

    function computeRelated(node) {
      if (!node.film) return [];
      return posterMeshes
        .map(m => m.userData.node)
        .filter(n => n.kind === "film" && n.rankId === node.rankId && n.film.title !== node.film.title)
        .sort((a, b) => Math.abs(a.film.year - node.film.year) - Math.abs(b.film.year - node.film.year))
        .slice(0, 4);
    }

    // ---- tiny tween helpers (no external dep) ----
    function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
    function tweenScale(mesh, targetVec, ms) {
      const start = mesh.scale.clone(), t0 = performance.now();
      const dur = reduced() ? Math.min(ms, 80) : ms;
      (function step() {
        const t = Math.min(1, (performance.now() - t0) / dur);
        mesh.scale.lerpVectors(start, targetVec, easeInOutCubic(t));
        if (t < 1) requestAnimationFrame(step);
      })();
    }
    function tweenVec3(vec, targetVec, ms) {
      const start = vec.clone(), t0 = performance.now();
      const dur = reduced() ? Math.min(ms, 80) : ms;
      (function step() {
        const t = Math.min(1, (performance.now() - t0) / dur);
        vec.lerpVectors(start, targetVec, easeInOutCubic(t));
        if (t < 1) requestAnimationFrame(step);
      })();
    }
    let angleTween = null;
    function tweenAngles(theta, phi, radius, ms) {
      const st = baseTheta, sp = basePhi, sr = camRadius, t0 = performance.now();
      const dur = reduced() ? Math.min(ms, 80) : ms;
      // shortest angular path
      let dTheta = theta - st;
      while (dTheta > Math.PI) dTheta -= Math.PI * 2;
      while (dTheta < -Math.PI) dTheta += Math.PI * 2;
      const id = {};
      angleTween = id;
      (function step() {
        if (angleTween !== id) return;
        const t = Math.min(1, (performance.now() - t0) / dur);
        const e = easeInOutCubic(t);
        baseTheta = st + dTheta * e;
        basePhi = sp + (phi - sp) * e;
        camRadius = sr + (radius - sr) * e;
        if (t < 1) requestAnimationFrame(step);
      })();
    }

    function projectToScreen(pos) {
      const v = pos.clone().project(camera);
      const rect = container.getBoundingClientRect();
      return { x: (v.x * 0.5 + 0.5) * rect.width, y: (-v.y * 0.5 + 0.5) * rect.height };
    }

    // ---- main loop ----
    function tick() {
      frameCount++;
      if (!isDown) {
        if (!reduced()) baseTheta += IDLE_DRIFT;
        baseTheta += dragVelTheta; basePhi += dragVelPhi;
        dragVelTheta *= FRICTION; dragVelPhi *= FRICTION;
        basePhi = Math.max(PHI_MIN, Math.min(PHI_MAX, basePhi));
      }

      let targetTheta = baseTheta, targetPhi = basePhi;
      if (hasPointer && !isDown && activePointers.size < 2 && !selected) {
        targetTheta += ndc.x * PARALLAX_MAX;
        targetPhi -= ndc.y * PARALLAX_MAX_V;
      }
      currentTheta += (targetTheta - currentTheta) * DAMPING;
      currentPhi += (targetPhi - currentPhi) * DAMPING;

      camera.position.set(
        camRadius * Math.sin(currentPhi) * Math.cos(currentTheta),
        camRadius * Math.cos(currentPhi),
        camRadius * Math.sin(currentPhi) * Math.sin(currentTheta)
      );
      camera.lookAt(0, 0, 0);

      if (frameCount % 3 === 0 && !selected && hasPointer) {
        raycaster.setFromCamera(ndc, camera);
        const hits = raycaster.intersectObjects(posterMeshes);
        setFocused(hits.length ? hits[0].object : null);
      }

      if (opts.onZoneSample) opts.onZoneSample(activeWedgeForAngle(baseTheta));

      renderer.render(scene, camera);
    }

    function resize() {
      const w = container.clientWidth, h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener("resize", resize);

    renderer.setAnimationLoop(tick);

    return {
      setField(nodes, wedgeList) { wedges = wedgeList; buildField(nodes); },
      resize,
      goBack,
      isSelected: () => !!selected,
      setInitialAngle(theta) { baseTheta = theta; currentTheta = theta; }
    };
  }

  window.TC.initScene = initScene;
})();

  </script>
  <script>
/* Boot + DOM wiring. Everything spatial/interactive lives in js/scene.js;
   this file only connects its callbacks to the chrome defined in
   index.html + css/style.css, and runs the loading sequence. */
(function () {
  const TC = window.TC;
  const rankingsById = {};
  TC.RANKINGS.forEach(r => (rankingsById[r.id] = r));

  const container = document.getElementById("canvas-container");

  const cursorDot = document.getElementById("cursor-dot");
  const cursorRing = document.getElementById("cursor-ring");
  const zoneLabel = document.getElementById("zone-label");
  const zoneName = zoneLabel.querySelector(".name");
  const zoneTe = zoneLabel.querySelector(".te");
  const focusInfo = document.getElementById("focus-info");
  const focusTitle = focusInfo.querySelector(".t");
  const focusMeta = focusInfo.querySelector(".m");
  const exploreHint = document.getElementById("explore-hint");
  const loader = document.getElementById("loader");
  const loaderStatus = document.getElementById("loader-status");
  const loaderBar = document.getElementById("loader-bar");
  const scrim = document.getElementById("scrim");
  const detail = document.getElementById("detail");
  const detailTitle = document.getElementById("detail-title");
  const detailMeta = document.getElementById("detail-meta");
  const detailDesc = document.getElementById("detail-desc");
  const detailRelated = document.getElementById("detail-related");
  const settingsToggle = document.getElementById("settings-toggle");
  const settingsPanel = document.getElementById("settings-panel");

  // ---- device/pointer capability classes (drives cursor visibility in CSS) ----
  const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
  document.body.classList.toggle("touch-device", isTouch);
  if (window.matchMedia && window.matchMedia("(pointer: fine)").matches) {
    document.body.classList.add("has-fine-pointer");
  }

  // ---- scene ----
  let lastRankId = null;
  let scene;
  try {
    scene = window.TC.initScene(container, {
    rankingsById,
    onPointerScreen(x, y) {
      cursorDot.style.transform = `translate(${x}px, ${y}px) translate(-50%,-50%)`;
      cursorRing.style.transform = `translate(${x}px, ${y}px) translate(-50%,-50%)`;
    },
    onFocusChange(node, screenPos) {
      if (!node || !screenPos) {
        cursorRing.classList.remove("hover");
        focusInfo.classList.remove("visible");
        return;
      }
      cursorRing.classList.toggle("hover", node.kind === "film");
      if (node.kind !== "film") { focusInfo.classList.remove("visible"); return; }
      const f = node.film;
      focusTitle.textContent = f.title;
      focusMeta.textContent = (f.upcoming ? "Upcoming " + f.year : f.year) + (f.person ? " · " + f.person : "");
      focusInfo.style.left = screenPos.x + "px";
      focusInfo.style.top = screenPos.y + "px";
      focusInfo.classList.add("visible");
    },
    onZoneSample(wedge) {
      if (!wedge || wedge.rankId === lastRankId) return;
      lastRankId = wedge.rankId;
      const r = rankingsById[wedge.rankId];
      zoneName.style.opacity = 0;
      setTimeout(() => {
        zoneName.textContent = r.name;
        zoneTe.textContent = r.telugu || "";
        zoneName.style.opacity = 1;
      }, 160);
    },
    onSelect(node, related) {
      const f = node.film;
      detailTitle.textContent = f.title;
      const bits = [f.upcoming ? "Upcoming — " + f.year : String(f.year)];
      if (f.person) bits.push(f.person);
      if (f.director && f.director !== f.person) bits.push("dir. " + f.director);
      bits.push(f.genre);
      detailMeta.textContent = bits.join(" · ");
      detailDesc.textContent = `A ${f.genre.toLowerCase()} film${f.person ? " starring " + f.person : ""}${f.upcoming ? ". Not yet released." : "."}`;
      detailRelated.innerHTML = "";
      related.forEach(n => {
        const span = document.createElement("span");
        span.textContent = n.film.title + " (" + n.film.year + ")";
        detailRelated.appendChild(span);
      });
      scrim.classList.add("open");
      detail.classList.add("open");
    },
    onDeselect() {
      scrim.classList.remove("open");
      detail.classList.remove("open");
    },
    onEmptyClick() {
      if (settingsPanel.classList.contains("open")) closeSettings();
    }
  });
  } catch (err) {
    loaderStatus.textContent = "Couldn't start (needs internet access for the 3D engine)";
    loaderBar.style.width = "100%";
    console.error(err);
    return;
  }

  detail.querySelector(".back").addEventListener("click", () => scene.goBack());
  scrim.addEventListener("click", () => scene.goBack());

  // ---- settings panel ----
  function closeSettings() { settingsPanel.classList.remove("open"); settingsToggle.setAttribute("aria-expanded", "false"); }
  settingsToggle.addEventListener("click", () => {
    const open = !settingsPanel.classList.contains("open");
    settingsPanel.classList.toggle("open", open);
    settingsToggle.setAttribute("aria-expanded", String(open));
  });
  settingsPanel.querySelectorAll("[data-motion]").forEach(btn => {
    btn.addEventListener("click", () => {
      settingsPanel.querySelectorAll("[data-motion]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      window.__TC_FORCE_REDUCED = btn.dataset.motion === "calm";
    });
  });
  settingsPanel.querySelectorAll("[data-cursor]").forEach(btn => {
    btn.addEventListener("click", () => {
      settingsPanel.querySelectorAll("[data-cursor]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const on = btn.dataset.cursor === "on";
      document.body.classList.toggle("has-fine-pointer", on && !isTouch);
      cursorDot.style.display = on ? "" : "none";
      cursorRing.style.display = on ? "" : "none";
    });
  });

  // ---- explore hint: fade once the user does anything ----
  let hintShown = true;
  function dismissHint() {
    if (!hintShown) return;
    hintShown = false;
    exploreHint.classList.add("hidden");
  }
  container.addEventListener("pointerdown", dismissHint, { once: true });
  setTimeout(dismissHint, 7000);

  // ---- loading sequence ----
  const STEPS = [
    "Assembling the archive…",
    "Placing " + TC.FILMS.length + " films…",
    "Forming the ranking zones…",
    "Calibrating the camera…"
  ];
  let step = 0;
  function advanceLoader() {
    loaderStatus.textContent = STEPS[step];
    loaderBar.style.width = Math.round(((step + 1) / (STEPS.length + 1)) * 100) + "%";
    step++;
    if (step < STEPS.length) {
      setTimeout(advanceLoader, 340);
    } else {
      // do the actual (synchronous, real) work here, not a fake delay
      const built = TC.buildLayout({
        rankings: TC.RANKINGS, films: TC.FILMS,
        radius: 18, fillerTotal: 0, restBoostFactor: 3
      });
      scene.setField(built.nodes, built.wedges);
      const firstWedge = built.wedges[0];
      scene.setInitialAngle((firstWedge.start + firstWedge.end) / 2);

      loaderBar.style.width = "100%";
      loaderStatus.textContent = "READY";
      setTimeout(() => loader.classList.add("fade-out"), 380);
    }
  }
  advanceLoader();
})();

  </script>
